# WirePlumber 0.5.x: /etc/wireplumber/wireplumber.conf.d/50-hifi-bridge-a2dp-input.conf (test Pi; the appliance image ships the same file)
#
# A phone streaming to the bridge becomes a PipeWire node `bluez_input.<MAC>.<n>`. With WirePlumber's default role "playback" that node
# is a PLAYBACK stream (Stream/Output/Audio) which WirePlumber links to the device's own speakers/headphone jack, and there is no source
# the bridge could record (real-hardware finding G1, 2026-11-24, docs/PIPEWIRE_CAPTURE.md). Role "input" makes it an Audio/Source:
# never played locally, recorded only by the bridge (which finds it by address + profile + media class, never by a guessed name).
# Upstream: WirePlumber docs "Bluetooth configuration", node property bluez5.media-source-role; PipeWire spa/plugins/bluez5/media-source.c.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = "input"
      }
    }
  }
]
