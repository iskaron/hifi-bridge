# Hi-Fi Bridge persistence rule (DECISIONS #121, docs/PERSISTENCE.md): no core dumps on the card. Soft and hard limit 0 for every
# service (a service cannot raise it again); the image has no systemd-coredump, and the kernel's core_pattern discards dumps anyway
# (/usr/lib/sysctl.d/90-hifi-bridge-coredump.conf).
[Manager]
DefaultLimitCORE=0
