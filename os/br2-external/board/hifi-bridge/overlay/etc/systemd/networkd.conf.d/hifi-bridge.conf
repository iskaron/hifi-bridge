# The root filesystem is read-only and /etc/machine-id is empty, so systemd uses a new transient machine id on every boot.
# networkd's default DUID ("vendor") is derived from that id and would change the DHCPv4 client id / DHCPv6 DUID - and possibly the
# device's address - after every reboot. Derive it from the interface's MAC address instead (OPEN_QUESTIONS #77).
[DHCPv4]
DUIDType=link-layer

[DHCPv6]
DUIDType=link-layer
