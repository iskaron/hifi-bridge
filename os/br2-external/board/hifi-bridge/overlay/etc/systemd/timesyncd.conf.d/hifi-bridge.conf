# Hi-Fi Bridge time synchronisation (docs/NETWORK.md "Time"). NTP servers announced by DHCP are used first (networkd UseNTP=yes);
# these public pool servers are only the fallback (owner decision pending, see the network report). The clock is saved on the data
# partition (/var/lib/systemd/timesync is bind-mounted), so a Pi without RTC starts with the last known time instead of the build date.
[Time]
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
SaveIntervalSec=60
