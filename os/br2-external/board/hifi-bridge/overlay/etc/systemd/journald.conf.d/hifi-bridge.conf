# Hi-Fi Bridge persistence rule (DECISIONS #121, docs/PERSISTENCE.md): logs live in a bounded RAM buffer only and are gone after a
# reboot. Storage=volatile keeps the journal in /run/log/journal (tmpfs) even if /var/log/journal existed; it is never written to the
# card. 16 MiB in files of at most 2 MiB is ~3 % of the 512 MiB of a Pi Zero 2 W and holds days of normal operation (the bridge logs a
# few lines per playback session). Long-term logs: an explicitly configured external syslog server (the bridge's TLS syslog setting).
[Journal]
Storage=volatile
RuntimeMaxUse=16M
RuntimeMaxFileSize=2M
ForwardToSyslog=no
