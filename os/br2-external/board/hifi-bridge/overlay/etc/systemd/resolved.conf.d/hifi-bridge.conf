# Hi-Fi Bridge name resolution (docs/NETWORK.md "Firewall and listeners", review N-8). systemd-resolved stays the DNS client for the
# device (DNS servers from DHCP, stub resolver on 127.0.0.53 only), but answers NOBODY on the network: no LLMNR responder (UDP/TCP 5355
# on every link with the compiled-in default) and no mDNS responder - Avahi alone owns mDNS (DECISIONS #49).
[Resolve]
LLMNR=no
MulticastDNS=no
