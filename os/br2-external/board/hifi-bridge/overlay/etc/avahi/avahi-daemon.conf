# Hi-Fi Bridge: Avahi publishes the device name on Ethernet, client Wi-Fi and the setup hotspot (DECISIONS #49/#52, docs/NETWORK.md).
# The host name is the owner's 'local_hostname' (set by hifi-netd before avahi-daemon starts and via SetHostName on changes).
[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes

[reflector]
enable-reflector=no

[rlimits]
