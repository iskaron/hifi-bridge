<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Hi-Fi Bridge (docs/OTA.md section 5): upstream RAUC's policy (/usr/share/dbus-1/system.d/de.pengutronix.rauc.conf) lets ANY local
     user control RAUC. This file is read after it (/etc after /usr/share) and closes that: only root and the bridge's service user may
     call RAUC. The bridge needs the Installer interface and reading its properties; it cannot set properties.
     Verified with a real dbus-daemon and the real RAUC 1.13 service (tests/os/test_ota_rauc_real.py), not yet on a device. -->
<busconfig>
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="hifi-bridge">
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
