# Image only (review N-14): the boot FAT is root-owned with write access for the group hifi-boot (post-build.sh fstab, hifi-bridge.mk).
# The boot step is the ONLY unit that joins this group; with ReadWritePaths=/boot (main unit) it can scrub the provisioning file,
# remove a processed recovery request and write hifi-status.txt. No capability is needed.
[Service]
SupplementaryGroups=hifi-boot
