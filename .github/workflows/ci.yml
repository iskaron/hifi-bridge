# CI for every existing and new test suite (DECISIONS #39). Each job calls the SAME Docker scripts that run locally
# (scripts/run_*.sh); nothing is installed on the runner besides Docker. Prepared only: the repository is not published yet,
# so this workflow has never run on GitHub (validated locally with actionlint).
name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_static.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: (cd docker && docker compose build -q)
      - run: scripts/run_unit.sh -q

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_integration.sh -q
      - run: scripts/test_outage.sh lms
      - run: scripts/test_outage.sh player1
      - if: always()
        run: scripts/lab_down.sh

  pipewire:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_pipewire.sh -q

  hwkit:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_hwkit.sh -q

  mdns:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: (cd docker && docker compose build -q && docker build -q -f Dockerfile.avahi -t btbridge-avahi:dev .)
      - run: scripts/test_mdns.sh

  os-and-flashtool:
    # phase-2b preparation: Buildroot defconfig resolution + licence policy (no image build), RAUC trust matrix, card layout,
    # flash tool core with SIMULATED cards. Never needs release keys: all keys are generated per test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/os_fetch_buildroot.sh
      - run: scripts/run_os.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_security.sh

  python314:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_py314.sh

  syslog:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: (cd docker && docker compose build -q)
      - run: scripts/test_syslog.sh -q

  coverage:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: (cd docker && docker compose build -q)
      - run: scripts/run_coverage.sh --integration
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/evidence/coverage.txt

  homeassistant:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_homeassistant.sh -q

  browser:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run_browser.sh -q
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots/
