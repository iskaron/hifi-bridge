# CI for every test suite (DECISIONS #39, #70). Each job calls the SAME Docker scripts that run locally (scripts/run_*.sh); nothing is
# installed on the runner besides Docker. Repository: github.com/iskaron/hifi-bridge (private). GitHub Actions is the project's CI.
# No job has access to signing keys: every key used by tests is generated per run (docs/UPDATE_TRUST.md section 4).
name: ci
on:
  push:
    branches: [develop, main]
    # documentation-only pushes do not need the ~1 h of runner minutes (private repository budget, OPEN_QUESTIONS #44)
    paths-ignore: ['**/*.md', 'docs/**', 'reports/**', 'measurements/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'reports/**', 'measurements/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_static.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: (cd docker && docker compose build -q)
      - run: scripts/run_unit.sh -q

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_integration.sh -q
      - run: scripts/test_outage.sh lms
      - run: scripts/test_outage.sh player1
      - if: always()
        run: scripts/lab_down.sh

  pipewire:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_pipewire.sh -q

  hwkit:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_hwkit.sh -q

  mdns:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: (cd docker && docker compose build -q && docker build -q -f Dockerfile.avahi -t btbridge-avahi:dev .)
      - run: scripts/test_mdns.sh

  os-and-flashtool:
    # phase-2b preparation: Buildroot defconfig resolution + licence policy (no image build), RAUC trust matrix, card layout,
    # flash tool core with SIMULATED cards. Never needs release keys: all keys are generated per test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/os_fetch_buildroot.sh
      - run: scripts/run_os.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0          # the secret scan covers the complete history
      - run: scripts/run_security.sh
      - run: scripts/run_secrets.sh

  python314:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_py314.sh

  syslog:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: (cd docker && docker compose build -q)
      - run: scripts/test_syslog.sh -q

  coverage:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: (cd docker && docker compose build -q)
      - run: scripts/run_coverage.sh --integration
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: reports/evidence/coverage.txt
          if-no-files-found: error

  homeassistant:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_homeassistant.sh -q

  browser:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run_browser.sh -q
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: reports/screenshots/
          if-no-files-found: warn
