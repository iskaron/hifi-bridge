# Hardware-free lab: real Lyrion Media Server + headless Squeezelite players.
# The network is `internal`: containers cannot reach the host LAN or internet.
name: btbridge-lab

x-lab: &lab
  image: btbridge-lab:dev
  build:
    context: .
    dockerfile: Dockerfile.lab
  volumes:
    - ..:/work
    - captures:/captures
  networks: [lab]

x-player: &player
  <<: *lab
  depends_on:
    lms:
      condition: service_healthy

services:
  # Real appliance (service + WebUI) with the SIMULATED phone (lab control on :8099). Profile "browser" (scripts/run_browser.sh).
  appliance:
    <<: *lab
    profiles: ["browser"]
    hostname: appliance
    depends_on:
      lms:
        condition: service_healthy
    volumes:
      - ..:/work
      - appliance-data:/data
    command: ["python3", "-m", "btkit.appliance_lab", "--data", "/data", "--http-port", "8080", "--https-port", "8443",
              "--stream-port", "8090", "--advertise-host", "appliance", "--source", "none", "--thermal-path", "", "--no-mdns",
              "--sim-port", "8099"]
    networks:
      lab:
        aliases: ["hifi-bridge.local"]       # the device's mDNS name, so Host validation and the certificate apply as on hardware

  browser:
    image: btbridge-browser:dev
    build:
      context: .
      dockerfile: Dockerfile.browser
    profiles: ["browser"]
    networks: [lab]
    ipc: host
    volumes:
      - ..:/work
      - appliance-data:/appliance-data:ro
    environment:
      - BASE_URL=http://hifi-bridge.local:8080
      - HTTPS_URL=https://hifi-bridge.local:8443
      - SIM_URL=http://appliance:8099
    working_dir: /work

  # mDNS interoperability (profile "mdns", scripts/test_mdns.sh): the bridge's responder vs. a real Avahi
  mdns-responder:
    <<: *lab
    profiles: ["mdns"]
    hostname: responder
    command: ["python3", "-m", "btbridge.net.mdns", "--hostname", "hifi-bridge", "--instance", "Hi-Fi Bridge (Lab)"]

  # Avahi backend (DECISIONS #49): the bridge's publisher talks to its OWN avahi-daemon over D-Bus (as on the appliance)
  mdns-avahi-pub:
    image: btbridge-avahi:dev
    profiles: ["mdns"]
    networks: [lab]
    hostname: avahipub
    volumes:
      - ..:/work:ro
    environment:
      - PYTHONPATH=/work/bridge
    command: ["sh", "-c", "mkdir -p /run/dbus && dbus-daemon --system --fork && avahi-daemon --no-drop-root --no-rlimits -D && sleep 2 && exec python3 -m btbridge.net.avahi --hostname hifi-bridge --instance 'Hi-Fi Bridge (Avahi)'"]

  avahi:
    image: btbridge-avahi:dev
    build:
      context: .
      dockerfile: Dockerfile.avahi
    profiles: ["mdns"]
    networks: [lab]
    hostname: avahipeer
    command: ["sh", "-c", "mkdir -p /run/dbus && dbus-daemon --system --fork && avahi-daemon --no-drop-root --no-rlimits -D && sleep infinity"]

  # REAL Home Assistant for MQTT-discovery integration tests (profile "ha", scripts/run_homeassistant.sh). Fresh config per run.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    profiles: ["ha"]
    networks: [lab]
    hostname: homeassistant
    environment:
      - TZ=UTC
    volumes:
      - ha-config:/config

  # Real rsyslog (TLS) for the optional secure remote syslog (profile "syslog", scripts/test_syslog.sh)
  syslog:
    image: btbridge-syslog:dev
    build:
      context: .
      dockerfile: Dockerfile.syslog
    profiles: ["syslog"]
    networks:
      lab:
        aliases: ["syslog.lan"]
    volumes:
      - ./rsyslog:/etc/rsyslog-lab:ro
      - syslog-certs:/certs:ro
      - syslog-out:/out

  mosquitto:
    image: eclipse-mosquitto:2.0.20@sha256:21421af7b32bf9ce508e9090c8eb13bb81f410ca778dc205506180a6f862d0eb
    networks: [lab]
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]

  lms:
    image: lmscommunity/lyrionmusicserver:9.1.2@sha256:a8709abda8a80766274abeb44015189b7e050eb1a6372678dcb077eb8c3a1e21
    networks: [lab]
    volumes:
      - ./lms-config:/seed:ro
      # LMS state lives in the project directory on the HOST filesystem: LMS runs as a non-root user and failed with
      # "database or disk is full" when Docker's data filesystem filled up (found 2026-11-15). Owned by LAB_UID (default 1000).
      - ../.lab/lms-config:/config
    environment:
      - HTTP_PORT=9000
      - PUID=${LAB_UID:-1000}
      - PGID=${LAB_GID:-1000}
    entrypoint: ["/bin/bash","-c","mkdir -p /config/prefs && [ -f /config/prefs/server.prefs ] || cp /seed/server.prefs /config/prefs/server.prefs; exec start-container"]
    healthcheck:
      test: ["CMD-SHELL","curl -fs -X POST -d '{\"id\":1,\"method\":\"slim.request\",\"params\":[\"\",[\"serverstatus\",0,1]]}' http://localhost:9000/jsonrpc.js >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  # Software Squeezelite players. `-o -` writes the decoded PCM to stdout, where
  # btkit.pcm_tap timestamps and records it (software stand-in for a speaker).
  player1: &p
    <<: *player
    hostname: player1
    command: ["python3","-m","btkit.run_player","--name","lab-player1","--mac","02:00:00:00:00:01","--server","lms:3483","--capture","/captures/player1"]
  player2:
    <<: *player
    hostname: player2
    command: ["python3","-m","btkit.run_player","--name","lab-player2","--mac","02:00:00:00:00:02","--server","lms:3483","--capture","/captures/player2"]
  player3:
    <<: *player
    hostname: player3
    command: ["python3","-m","btkit.run_player","--name","lab-player3","--mac","02:00:00:00:00:03","--server","lms:3483","--capture","/captures/player3"]
  # Emulated *legacy* capability: reports only PCM+MP3 (like a Squeezebox 1),
  # so LMS must pick a compatible format / transcode. Capability negotiation
  # emulation only - NOT a real Squeezebox.
  legacy1:
    <<: *player
    hostname: legacy1
    command: ["python3","-m","btkit.run_player","--name","lab-legacy-pcm-mp3","--mac","02:00:00:00:00:10","--server","lms:3483","--capture","/captures/legacy1","--codecs","pcm,mp3"]

  # Test runner / bridge host. Started on demand (`run`), shares the lab network.
  runner:
    <<: *lab
    hostname: runner
    profiles: ["tools"]
    working_dir: /work
    command: ["sleep","infinity"]

networks:
  lab:
    internal: true
    driver_opts:
      # No host address on the lab bridge: lab containers cannot reach services of the host (e.g. a real Lyrion server answering the
      # wizard's discovery broadcast). Found by the demo stack test on 2026-11-17 (DECISIONS #71).
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  lms-config:
  captures:
  appliance-data:
  ha-config:
  syslog-certs:
  syslog-out:
