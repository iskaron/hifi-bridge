# Lab-only TLS syslog receiver. Certificates are created by the test (device CA, name syslog.lan) in the shared volume /certs.
global(DefaultNetstreamDriver="gtls"
       DefaultNetstreamDriverCAFile="/certs/certs/ca.crt"
       DefaultNetstreamDriverCertFile="/certs/certs/server.crt"
       DefaultNetstreamDriverKeyFile="/certs/certs/server.key")
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.Authmode="anon")
input(type="imtcp" port="6514")
template(name="raw" type="string" string="%pri% %hostname% %app-name% %msg%\n")
*.* action(type="omfile" file="/out/messages" template="raw")
